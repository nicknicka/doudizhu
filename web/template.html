<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>斗地主决策助手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  /* 配色 / 字体 / 侧栏位置由外部随机串派生（web/design-seed.txt），
     构建时注入。随机串本身不在这个文件里。 */
  :root{
    --ground:__GROUND__; --ink:__INK__; --muted:__MUTED__;
    --accent:__ACCENT__; --side-a:__SIDE_A__; --side-b:__SIDE_B__;
    --display:__FONT_DISPLAY__; --data:__FONT_DATA__;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
       font-family:var(--display);-webkit-font-smoothing:antialiased;
       font-size:15px;line-height:1.5}
  /* 留白先给多：外层 96px、区块间距 72px。宁可空，不填满。 */
  .page{max-width:1040px;margin:0 auto;padding:96px 40px 120px}
  .cols{display:grid;grid-template-columns:1fr 268px;gap:72px;align-items:start}
  .cols[data-side="left"]{grid-template-columns:268px 1fr}
  .cols[data-side="left"] > aside{order:-1}

  header{margin-bottom:72px}
  h1{margin:0;font-size:15px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
  .who{font-family:var(--data);font-size:13px;color:var(--muted);margin-top:6px}

  .state{display:flex;gap:56px;margin-bottom:72px;font-family:var(--data)}
  .state div{line-height:1}
  .state .n{font-size:38px;font-weight:300;letter-spacing:-.02em}
  .state .k{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:10px}
  .state .n.hi{color:var(--accent)}

  h2{font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;
     color:var(--muted);margin:0 0 28px}
  ul.bets{list-style:none;margin:0;padding:0;font-family:var(--data)}
  ul.bets li{display:grid;grid-template-columns:1fr auto;align-items:baseline;
             padding:18px 0;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
  ul.bets li:last-child{border-bottom:0}
  /* 排版的大胆处：候选用大字，分数反而小 —— 让人先看见"出什么"，再看见"多少分" */
  ul.bets .play{font-family:var(--display);font-size:32px;font-weight:300;letter-spacing:-.01em}
  ul.bets .play.pass{color:var(--muted)}
  ul.bets .sc{font-size:13px;color:var(--muted);
              font-variant-numeric:tabular-nums;letter-spacing:.02em}
  ul.bets li[aria-current="true"] .play{color:var(--accent)}
  ul.bets li[aria-current="true"] .sc{color:var(--accent)}

  aside{position:sticky;top:96px}
  .cloud{margin-bottom:36px}
  canvas{display:block;width:100%;height:176px}   /* 放侧栏，小 */
  .keys{display:flex;gap:14px;font-family:var(--data);font-size:11px;color:var(--muted);
        margin-top:10px}
  .keys i{display:inline-block;width:6px;height:6px;margin-right:5px;vertical-align:1px}
  .plist{list-style:none;margin:0;padding:0;font-family:var(--data);font-size:12px}
  .plist li{display:flex;justify-content:space-between;padding:7px 0;color:var(--muted)}
  .plist li b{font-weight:400;color:var(--ink)}
  .steps{display:flex;gap:6px;margin-bottom:36px;font-family:var(--data)}
  .steps button{background:none;border:0;padding:3px 0;margin-right:14px;cursor:pointer;
    font:inherit;font-size:12px;color:var(--muted);
    border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
  .steps button:hover{color:var(--ink)}
  .steps button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

  footer{margin-top:72px;display:flex;gap:56px;font-family:var(--data);
         border-top:1px solid color-mix(in srgb,var(--ink) 12%,transparent);padding-top:28px}
  footer .k{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  footer .v{font-size:22px;font-weight:300;margin-top:6px}
  footer .v small{display:block;font-size:11px;color:var(--muted);letter-spacing:0;margin-top:4px}

  #tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--ground);
       padding:5px 9px;font-family:var(--data);font-size:11px;z-index:9;opacity:0}
  @media (max-width:820px){
    .page{padding:56px 22px 72px}
    .cols,.cols[data-side="left"]{grid-template-columns:1fr;gap:48px}
    .cols[data-side="left"] > aside{order:0}
    aside{position:static}
    .state{gap:32px;flex-wrap:wrap}
    .state .n{font-size:30px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>斗地主决策助手</h1>
    <div class="who" id="who"></div>
  </header>

  <div class="cols" id="cols">
    <main>
      <div class="state" id="state"></div>
      <div class="steps" id="steps"></div>

      <h2>候选</h2>
      <ul class="bets" id="bets"></ul>
    </main>

    <aside>
      <div class="cloud">
        <canvas id="cloud"></canvas>
        <div class="keys">
          <span><i id="ka" style="background:var(--side-a)"></i><span id="la"></span></span>
          <span><i id="kb" style="background:var(--side-b)"></i><span id="lb"></span></span>
        </div>
      </div>
      <ul class="plist" id="plist"></ul>
    </aside>
  </div>

  <footer id="foot"></footer>
</div>
<div id="tip"></div>

<script>
const DATA = /*__DATA__*/null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const RANK = '3456789TJQKA2BR';
const ROWS = 200;
let pts = DATA.points, cur = 0, grid = [], order = [], rate = [], tipEl = $('tip');

/* 粒子云：每个粒子是一次完整分配。行按"归 A 的张数"排序，
   相似的假设聚成块 —— 结构从排序里长出来，不是另外画的。 */
const cv = $('cloud'), cx = cv.getContext('2d');
const countIn = (a,c) => a.filter(x=>x===c).length;

function build(){
  const p = pts[cur];
  order = [];
  for (const r of RANK){
    const n = Math.max(...p.particles.map(([a,b]) => countIn(a,r)+countIn(b,r)));
    for (let i=0;i<n;i++) order.push(r);
  }
  grid = p.particles.map(([a,b]) => {
    const seen = {};
    return order.map(c=>{
      seen[c] = (seen[c]||0)+1;
      if (seen[c] <= countIn(a,c)) return 1;
      return seen[c] <= countIn(a,c)+countIn(b,c) ? 2 : 0;
    });
  });
  grid.sort((x,y)=>{
    const sx=x.reduce((s,v)=>s+(v===1),0), sy=y.reduce((s,v)=>s+(v===1),0);
    return sx-sy || x.join('').localeCompare(y.join(''));
  });
  rate = order.map((_,c)=> grid.filter(r=>r[c]===1).length/grid.length);
}

function sizeCanvas(){
  const r = devicePixelRatio||1;
  cv.width = cv.clientWidth*r; cv.height = cv.clientHeight*r;
  cx.setTransform(r,0,0,r,0,0);
}
function draw(hover=-1){
  const w = cv.clientWidth/order.length, h = cv.clientHeight/ROWS;
  cx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  const A = getComputedStyle(document.documentElement).getPropertyValue('--side-a').trim();
  const B = getComputedStyle(document.documentElement).getPropertyValue('--side-b').trim();
  for (let r=0;r<Math.min(ROWS,grid.length);r++)
    for (let c=0;c<order.length;c++){
      if (hover>=0 && c!==hover){ cx.globalAlpha=.13; }
      else cx.globalAlpha=1;
      cx.fillStyle = grid[r][c]===1 ? A : grid[r][c]===2 ? B : 'transparent';
      if (grid[r][c]) cx.fillRect(c*w, r*h, Math.max(w-.7,.5), Math.max(h-.5,.5));
    }
  cx.globalAlpha=1;
}
function layout(){ sizeCanvas(); build(); draw(); }

function render(){
  const p = pts[cur];
  $('who').textContent = `${DATA.record_id} · 共 ${DATA.total_steps} 手 · 我方 ${DATA.me}`;
  $('cols').dataset.side = '__SIDE__';

  $('state').innerHTML = [
    ['剩余', p.remaining[DATA.me], true],
    ['牌池', p.pool_size, false],
    ['上一手', p.last_move.length ? p.last_move.join('') : '—', false],
  ].map(([k,v,hi])=>
    `<div><div class="n${hi?' hi':''}">${v}</div><div class="k">${k}</div></div>`).join('');

  const best = Math.max(...p.candidates.map(c=>c.score));
  $('bets').innerHTML = p.candidates.map((c,i)=>
    `<li${i===0?' aria-current="true"':''}>
       <span class="play${c.label==='不出'?' pass':''}">${c.label}</span>
       <span class="sc">${c.score>0?'+':''}${c.score.toFixed(3)}</span>
     </li>`).join('');

  $('la').textContent = p.opponents[0]; $('lb').textContent = p.opponents[1];

  const rows = order.map((c,i)=>[c, rate[i]])
    .filter(([c,r]) => r>0 && r<1)
    .sort((x,y)=>Math.abs(y[1]-.5)-Math.abs(x[1]-.5)).slice(0,6);
  $('plist').innerHTML = rows.map(([c,r])=>
    `<li><span>${c}</span><b>${(r*100).toFixed(0)}%</b></li>`).join('');

  $('foot').innerHTML = [
    ['Top-1', (DATA.metrics.top1*100).toFixed(1)+'%', `基线 ${(DATA.metrics.top1_base*100).toFixed(1)}%`],
    ['对数似然', DATA.metrics.ll, `基线 ${DATA.metrics.ll_base}`],
    ['决策点', DATA.metrics.n_positions, `${DATA.metrics.n_cards} 计分项`],
  ].map(([k,v,s])=>`<div><div class="k">${k}</div><div class="v">${v}<small>${s}</small></div></div>`).join('');

  layout();
  $('steps').querySelectorAll('button').forEach((b,i)=>
    b.setAttribute('aria-current', String(i===cur)));
}

function go(i){
  if (i===cur) return; cur=i; render();
  if (reduce) return;
  gsap.fromTo(cv,{opacity:.15},{opacity:1,duration:.5,ease:'power2.out'});
  gsap.fromTo('#bets li',{y:10,opacity:0},{y:0,opacity:1,duration:.42,stagger:.06,ease:'power3.out'});
}

cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  const c = Math.floor((e.clientX-r.left)/(r.width/order.length));
  if (!(c>=0 && c<order.length)) return;
  draw(c);
  tipEl.textContent = `${order[c]} · ${(rate[c]*100).toFixed(0)}% ${pts[cur].opponents[0]}`;
  tipEl.style.opacity=1;
  tipEl.style.left=(e.clientX+12)+'px'; tipEl.style.top=(e.clientY-28)+'px';
});
cv.addEventListener('mouseleave', ()=>{ draw(); tipEl.style.opacity=0; });
addEventListener('resize', layout);

$('steps').innerHTML = pts.map((p,i)=>`<button type="button" data-i="${i}">第 ${p.step} 手</button>`).join('');
$('steps').addEventListener('click', e=>{
  const b = e.target.closest('button'); if (b) go(+b.dataset.i);
});
render();

if (!reduce) gsap.timeline({defaults:{ease:'power3.out'}})
  .from('header',{opacity:0,y:-8,duration:.5})
  .from('#state > div',{opacity:0,y:12,duration:.5,stagger:.08},'-=.3')
  .from('#bets li',{opacity:0,y:10,duration:.45,stagger:.06},'-=.3')
  .from('aside > *',{opacity:0,x:10,duration:.45,stagger:.08},'-=.4')
  .from('footer > div',{opacity:0,y:8,duration:.4,stagger:.06},'-=.35');
</script>
</body>
</html>
