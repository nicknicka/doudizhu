name: CI

# 目的：让 PR 上的"绿"等于分支头的绿。
# 此前没有任何检查，"npm run verify 全绿"的证据只能来自某个人带未提交改动的
# 工作区 —— #57 就是这么漏过去的（合入的头在干净树上根本跑不过 verify）。
#
# 三条检查的取舍（#60 已收口）：
#   server / web-unit —— 硬门禁。在干净 runner 上稳定，快。
#   browser            —— 只手动触发。它曾在 ubuntu 上 flaky（#60：同一 commit
#                         连跑 4 次失败 2 次）；#86 把「点一下 sleep 900ms 再读
#                         状态」换成轮询后清成 4/4。现在不上每次推送，理由只剩
#                         分钟数 —— 它要装 Chromium 再走完整端到端，一次约 7 分钟，
#                         改版式后手动跑一次就够。
#                         browser verify 是唯一能挡住 #57 那类「干净树上跑不过 verify」
#                         回归的检查；哪天觉得 7 分钟值，把它提成门禁即可。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 服务端与规则（pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      # 页面与 verify 都硬用 .venv/bin/python（见 web/verify.mjs:391），CI 照同一布局装
      - name: 装依赖（venv 布局与 README 一致）
        run: |
          python3.11 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements.lock.txt
          .venv/bin/python -m pip install --no-cache-dir -e . --no-deps

      - name: pytest
        run: .venv/bin/python -m pytest -q

  web-unit:
    name: 展示页纯逻辑单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 只跑纯逻辑：不装浏览器、不起后端。
      - name: node --test
        run: node --test web/test/*.test.mjs

  browser:
    name: 展示页真实交互（browser verify，手动）
    # 见文件头：手动触发是为了省分钟数（一次约 7 分钟），不是因为不稳定 ——
    # flaky 已在 #86 清掉，连跑 4 次全过。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: 装后端依赖（verify 会自己起 FastAPI）
        run: |
          python3.11 -m venv .venv
          .venv/bin/python -m pip install --no-cache-dir -r requirements.lock.txt
          .venv/bin/python -m pip install --no-cache-dir -e . --no-deps

      - name: 取 ONNX 权重（不进 Git，约 18 MB）
        run: .venv/bin/python scripts/download_models.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装 Playwright 与 Chromium
        # package-lock.json 不入库，^1.49.0 会被解析成当日最新版；
        # 浏览器端到端检查对 Playwright 版本敏感，这里锁到本地实测通过的版本。
        run: |
          npm i --no-save playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: 浏览器端到端 verify
        run: npm run verify
